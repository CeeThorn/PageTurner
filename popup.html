<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="index.css">
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>

    <style>
    body {
      font-family: Arial, sans-serif;
      width: 220px;
      text-align: center;
      padding: 10px;
    }

    button {
      margin: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }

    #speedDisplay, #delayDisplay {
      margin: 5px 0;
      font-weight: bold;
    }

    input[type="number"] {
      width: 50px;
      margin-left: 5px;
    }

    label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3 class="title">AutoScroller</h3>

  <div class="group">
    <button class="play" id="start">Start</button>
    <button class="play" id="stop">Stop</button>
  </div>

  <div class="group">
    <button id="increase" class="box">+</button>
    <button id="decrease" class="box">-</button>
    </div>
    <div id="speedDisplay">Speed: 1</div>
  

  <div class="group">
    <button id="forward" class="box">
       <i class="fa-solid fa-arrow-down"></i>
      </button>
    <button id="reverse" class="box">
       <i class="fa-solid fa-arrow-up"></i>
      </button>
  </div>

  <div>
    <div class="group">
    <label>Page Delay (ms):
      <input id="delayInput" type="number" value="2000" min="0" step="500">
    </label>
    <button id="setDelay" class="box">Set</button>
    </div>
    <div id="delayDisplay">Delay: 2000ms</div>
  </div>

  <script src="background.js"></script>  
</body>
</html>
